<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiro IA</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="logo">🌿 Shiro IA</span>
      <button class="btn-icon" id="btn-new-chat" title="Nouvelle conversation">✏️</button>
    </div>

    <!-- Utilisateur connecté -->
    <div class="user-section" id="user-section">
      <div class="user-info">
        <span class="user-avatar">👤</span>
        <span class="user-email" id="user-email">...</span>
      </div>
      <button class="btn-logout" id="btn-logout">🚪 Déconnexion</button>
    </div>

    <!-- Clé API -->
    <div class="api-section">
      <label>Clé API Groq</label>
      <div class="api-input-wrap">
        <input type="password" id="api-key" placeholder="gsk_..." />
        <button class="btn-save-key" id="btn-save-key">Sauver</button>
      </div>
      <a href="https://console.groq.com/keys" target="_blank" class="get-key-link">→ Obtenir une clé gratuite</a>
    </div>

    <!-- Choix du modèle -->
    <div class="model-section">
      <label>Modèle IA</label>
      <select id="model-select">
        <optgroup label="⚡ Les plus rapides">
          <option value="openai/gpt-oss-20b">GPT OSS 20B — Ultra rapide ⚡ (1000 t/s)</option>
          <option value="llama-3.1-8b-instant">Llama 3.1 8B — Ultra rapide ⚡ (560 t/s)</option>
        </optgroup>
        <optgroup label="🧠 Les plus puissants">
          <option value="openai/gpt-oss-120b">GPT OSS 120B — Très puissant (500 t/s)</option>
          <option value="llama-3.3-70b-versatile">Llama 3.3 70B — Puissant (280 t/s)</option>
        </optgroup>
        <optgroup label="🌟 Autres">
          <option value="qwen/qwen3.8-27b">Qwen 3.8 27B — Alibaba (450 t/s)</option>
        </optgroup>
      </select>
      <div class="model-info" id="model-info">Contexte : 128k tokens • Gratuit</div>
    </div>

    <!-- Historique -->
    <div class="history-section">
      <label>Conversations</label>
      <div class="history-list" id="history-list"></div>
    </div>

    <div class="sidebar-footer">
      <button class="btn-clear-all" id="btn-clear-all">🗑️ Tout effacer</button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">
    <header class="topbar">
      <button class="btn-icon btn-toggle-sidebar" id="btn-toggle-sidebar">☰</button>
      <span class="current-model" id="current-model-label">GPT OSS 20B</span>
      <button class="btn-icon" id="btn-clear-chat" title="Vider le chat">🗑️</button>
    </header>

    <div class="messages-wrap" id="messages-wrap">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🌴</div>
        <h1>Shiro IA</h1>
        <p>Entre ta clé API Groq et commence à discuter.<br/>Choisis ton modèle dans le panneau de gauche.</p>
        <a href="https://console.groq.com/keys" target="_blank" class="btn-get-key">Obtenir une clé gratuite →</a>
      </div>
      <div id="messages"></div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="user-input" placeholder="Envoie un message... (Entrée pour envoyer, Maj+Entrée pour saut de ligne)" rows="1"></textarea>
        <button class="btn-send" id="btn-send" title="Envoyer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="input-footer">Les réponses sont générées par IA et peuvent contenir des erreurs.</div>
    </div>
  </main>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyB7lQPA2Oj2ncw3NzDkCg49XCDHM3K7LxM",
      authDomain:        "shiroia-ac299.firebaseapp.com",
      projectId:         "shiroia-ac299",
      storageBucket:     "shiroia-ac299.firebasestorage.app",
      messagingSenderId: "97823288104",
      appId:             "1:97823288104:web:aee33c055354d9f06b3e1d",
      measurementId:     "G-GMTS6BFJMV"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Guard : si non connecté → rediriger vers auth.html
    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "auth.html";
      } else {
        // Afficher l'email de l'utilisateur
        const emailEl = document.getElementById('user-email');
        if (emailEl) emailEl.textContent = user.email;
        // Lancer l'app
        if (typeof initApp === 'function') initApp();
      }
    });

    // Déconnexion
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = "auth.html";
    });
  </script>

  <script src="app.js"></script>
</body>
</html>
